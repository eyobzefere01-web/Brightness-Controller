name: Build Standalone Binary with Nuitka
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf \
            ccache \
            pkg-config \
            python3-dev \
            libcairo2-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            python3-gi \
            python3-gi-cairo \
            python3-cairo \
            imagemagick \
            jq

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install nuitka flask pywebview "PyGObject<3.50"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile Application with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --include-package=webview \
            --include-package=flask \
            --include-data-dir=templates=templates \
            --include-data-dir=static=static \
            --output-filename=brightness-controller \
            GUI.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brightness-controller-linux
          path: brightness-controller

      - name: Build AppDir structure
        run: |
          APPDIR=BrightnessController.AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp brightness-controller "$APPDIR/usr/bin/brightness-controller"
          chmod +x "$APPDIR/usr/bin/brightness-controller"

          if [ -f assets/icon.png ]; then
            cp assets/icon.png "$APPDIR/brightness-controller.png"
          else
            convert -size 256x256 xc:'#2b2b2b' -gravity center \
              -fill white -pointsize 40 -annotate 0 "BC" \
              "$APPDIR/brightness-controller.png"
          fi

          cat > "$APPDIR/brightness-controller.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Brightness Controller
          Exec=brightness-controller
          Icon=brightness-controller
          Categories=Utility;
          Terminal=false
          EOF

          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/brightness-controller" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

      - name: Download linuxdeploy and GTK plugin
        run: |
          # Dynamically fetch the direct AppImage download link from GitHub releases
          LINUXDEPLOY_URL=$(curl -s https://api.github.com/repos/linuxdeploy/linuxdeploy/releases | jq -r '.[0].assets[] | select(.name == "linuxdeploy-x86_64.AppImage") | .browser_download_url')
          
          curl -sL "$LINUXDEPLOY_URL" -o linuxdeploy
          curl -sL https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -o linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh

      - name: Build AppImage with bundled GTK/WebKit
        run: |
          export DEPLOY_GTK_VERSION=3
          NO_STRIP=1 ./linuxdeploy \
            --appimage-extract-and-run \
            --appdir=BrightnessController.AppDir \
            --executable=BrightnessController.AppDir/usr/bin/brightness-controller \
            --desktop-file=BrightnessController.AppDir/brightness-controller.desktop \
            --icon-file=BrightnessController.AppDir/brightness-controller.png \
            --plugin gtk \
            --output appimage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brightness-controller-appimage
          path: '*.AppImage'

name: Build Standalone Binary with Nuitka

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf \
            ccache \
            pkg-config \
            libcairo2-dev \
            libgirepository1.0-dev \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            python3-gi \
            python3-gi-cairo \
            python3-cairo

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages nuitka flask pywebview PyGObject
          if [ -f requirements.txt ]; then pip install --break-system-packages -r requirements.txt; fi

      - name: Compile Application with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --include-package=webview \
            --include-package=flask \
            --include-data-dir=templates=templates \
            --include-data-dir=static=static \
            --output-filename=brightness-controller \
            GUI.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brightness-controller-linux
          path: brightness-controller

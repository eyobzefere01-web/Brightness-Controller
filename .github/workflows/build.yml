name: Build Standalone Binary with Nuitka
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf \
            ccache \
            pkg-config \
            libcairo2-dev \
            libgirepository-2.0-dev \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            python3-gi \
            python3-gi-cairo \
            python3-cairo \
            imagemagick
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka flask pywebview PyGObject
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Compile Application with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --include-package=webview \
            --include-package=flask \
            --include-data-dir=templates=templates \
            --include-data-dir=static=static \
            --output-filename=brightness-controller \
            GUI.py
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brightness-controller-linux
          path: brightness-controller

      - name: Build AppDir structure
        run: |
          APPDIR=BrightnessController.AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp brightness-controller "$APPDIR/usr/bin/brightness-controller"
          chmod +x "$APPDIR/usr/bin/brightness-controller"

          # Use repo icon if you have one at assets/icon.png, otherwise generate a placeholder
          if [ -f assets/icon.png ]; then
            cp assets/icon.png "$APPDIR/brightness-controller.png"
          else
            convert -size 256x256 xc:'#2b2b2b' -gravity center \
              -fill white -pointsize 40 -annotate 0 "BC" \
              "$APPDIR/brightness-controller.png"
          fi

          cat > "$APPDIR/brightness-controller.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Brightness Controller
          Exec=brightness-controller
          Icon=brightness-controller
          Categories=Utility;
          Terminal=false
          EOF

          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/brightness-controller" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          ./appimagetool --appimage-extract-and-run BrightnessController.AppDir BrightnessController-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brightness-controller-appimage
          path: BrightnessController-x86_64.AppImage

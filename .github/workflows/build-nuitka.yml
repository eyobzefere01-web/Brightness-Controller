name: Build with Nuitka

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-linux-deb:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          debhelper \
          python3.11-dev \
          libpython3.11-dev

    - name: Upgrade pip and install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
        pip install nuitka ordered-set patchelf

    - name: Create build directory
      run: mkdir -p build

    - name: Compile with Nuitka
      run: |
        python -m nuitka \
          --onefile \
          --follow-imports \
          --include-package=flask \
          --include-package=webview \
          --include-package=qtpy \
          --include-package=PyQt6 \
          --output-dir=build \
          --remove-output \
          GUI.py
      timeout-minutes: 30

    - name: Check compiled binary
      run: |
        ls -lh build/GUI*
        file build/GUI* || true

    - name: Create .deb package
      run: |
        mkdir -p deb_package/DEBIAN
        mkdir -p deb_package/usr/local/bin
        mkdir -p deb_package/usr/share/applications
        
        # Copy compiled binary
        cp build/GUI.bin deb_package/usr/local/bin/brightness-controller || cp build/GUI deb_package/usr/local/bin/brightness-controller
        chmod +x deb_package/usr/local/bin/brightness-controller
        
        # Create desktop entry
        cat > deb_package/usr/share/applications/brightness-controller.desktop << 'EOF'
        [Desktop Entry]
        Type=Application
        Name=Brightness Controller
        Exec=brightness-controller
        Icon=preferences-system
        Categories=Utility;
        EOF
        
        # Create control file
        cat > deb_package/DEBIAN/control << 'EOF'
        Package: brightness-controller
        Version: 1.0.0
        Architecture: amd64
        Maintainer: Eyob <eyob@example.com>
        Description: Brightness Controller GUI Application
         A PyQt6 and Flask-based application for controlling system brightness
        Depends: libqt6gui6, libqt6core6, libqt6webenginecore6
        EOF
        
        # Build the deb package
        dpkg-deb --build deb_package brightness-controller.deb
        ls -lh brightness-controller.deb

    - name: Upload .deb artifact
      uses: actions/upload-artifact@v3
      with:
        name: brightness-controller-deb
        path: brightness-controller.deb
        retention-days: 30

    - name: Create Release with .deb
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: brightness-controller.deb
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

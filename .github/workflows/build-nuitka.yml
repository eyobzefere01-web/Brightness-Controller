name: Build Debian Package

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Create DEB Package Directory Structure
      run: |
        mkdir -p deb_package/DEBIAN
        mkdir -p deb_package/opt/brightness-controller
        mkdir -p deb_package/usr/bin
        mkdir -p deb_package/usr/share/applications
        mkdir -p deb_package/usr/share/pixmaps
        
    - name: Copy Application Files
      run: |
        cp -r app.py GUI.py requirements.txt static/ templates/ deb_package/opt/brightness-controller/
        
    - name: Create Wrapper Script
      run: |
        cat > deb_package/usr/bin/brightness-controller << 'EOF'
        #!/bin/bash
        exec python3 /opt/brightness-controller/GUI.py "$@"
        EOF
        chmod +x deb_package/usr/bin/brightness-controller
        
    - name: Create Desktop Entry
      run: |
        cat > deb_package/usr/share/applications/brightness-controller.desktop << 'EOF'
        [Desktop Entry]
        Type=Application
        Name=Brightness Controller
        Comment=System Brightness Control
        Exec=brightness-controller
        Icon=preferences-system-brightness-lock
        Categories=Utility;System;
        Terminal=false
        EOF

    - name: Create preinst Script
      run: |
        cat > deb_package/DEBIAN/preinst << 'EOF'
        #!/bin/bash
        set -e
        exit 0
        EOF
        chmod 755 deb_package/DEBIAN/preinst

    - name: Create postinst Script
      run: |
        cat > deb_package/DEBIAN/postinst << 'EOF'
        #!/bin/bash
        set -e
        
        # Install Python dependencies
        pip3 install -r /opt/brightness-controller/requirements.txt
        
        echo "Brightness Controller installed successfully!"
        exit 0
        EOF
        chmod 755 deb_package/DEBIAN/postinst

    - name: Create postrm Script
      run: |
        cat > deb_package/DEBIAN/postrm << 'EOF'
        #!/bin/bash
        set -e
        rm -rf /opt/brightness-controller
        exit 0
        EOF
        chmod 755 deb_package/DEBIAN/postrm

    - name: Create Control File
      run: |
        cat > deb_package/DEBIAN/control << 'EOF'
        Package: brightness-controller
        Version: 1.0.0
        Architecture: all
        Maintainer: Eyob <eyob@example.com>
        Depends: python3 (>= 3.10), python3-pip, python3-venv, libqt6gui6, libqt6core6, libqt6webenginecore6
        Description: Brightness Controller GUI Application
         A PyQt6 and Flask-based application for controlling system brightness.
         This package installs the application and its dependencies automatically.
        Homepage: https://github.com/eyobzefere01-web/Brightness-Controller
        EOF

    - name: Build DEB Package
      run: |
        dpkg-deb --build deb_package brightness-controller.deb
        ls -lh brightness-controller.deb

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: brightness-controller-deb
        path: brightness-controller.deb
        retention-days: 90

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: brightness-controller.deb
        body: "Brightness Controller v1.0.0 - Debian Package"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
